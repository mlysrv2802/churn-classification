[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "0.1.0"
description = "Telco customer churn classification"
requires-python = ">=3.12"
dependencies = ["pandas", "numpy", "scikit-learn", "matplotlib", "fastapi", "uvicorn"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
