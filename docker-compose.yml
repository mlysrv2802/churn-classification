services:
  # One-shot job: trains the model and writes it to ./models. Run on demand:
  #   docker compose run --rm train
  train:
    build: .
    image: churn-classification
    profiles: ["train"]
    command: python scripts/train.py
    volumes:
      - ./data:/storage/data:ro
      - ./models:/storage/models

  # The prediction API. Needs a trained model in ./models (run `train` first).
  api:
    build: .
    image: churn-classification
    ports:
      - "8000:8000"
    volumes:
      - ./models:/storage/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
